---

- name: Disable all nodes swap memory
  hosts: nodes
  become: true
  tasks:
    - name: Disable swap
      ansible.builtin.command: 
        cmd: swapoff -a
      when: ansible_swaptotal_mb > 0

    - name: Ensure swap is disabled in /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(.+\s+swap\s+.+)$'
        replace: '# \1'
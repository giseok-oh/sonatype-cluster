---

libvirt_vms:
  - name: cicd_master01
    vcpus: 1
    memory_mb: 1024
    volumes:
      - pool: "default"
        device: "disk"
        format: "qcow2"
        name: "sdb01"
        capacity: "10G"
        target: "vda"
    interfaces:
      - type: "network"
        network: "default"

